[project]
name = "robot-navigation-workbench-backend"
version = "0.1.0"
description = "Robot navigation workbench simulation backend (FastAPI + simulation engine)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
